name: Deploy console to GitHub Pages

on:
  # 定时重跑流水线，保持线上快照页新鲜（对齐 Collect-IPTV 的「每 N 小时自动更新」）
  # GitHub 的 cron 为 UTC 时间；如需更频繁可改为 "0 */4 * * *"（每 4 小时）
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [master]
    paths:
      - 'src/livetv/web/static/**'
      - 'src/livetv/**'
      - 'scripts/**'
      - 'config/**'
      - 'pyproject.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# 允许工作流把产物发布到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新推送会取消进行中的旧部署
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      # 在 CI 里用 Python 跑流水线：抓取源 + 逐条检测（存活/延迟/码率），产出
      # output/live.m3u（已检测可导入清单）与 output/report.json（含评分的快照）。
      # 对齐 Collect-IPTV：每次定时/推送都做真实检测，线上不再是空壳。
      - name: Generate report (with live detection)
        run: python -m livetv check --config config/sources.yaml --out output/live.m3u --report output/report.json

      # 把报告塞进页面，生成只读快照静态站点到 dist/
      - name: Build static snapshot
        run: python scripts/build_static.py --report output/report.json --out dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
