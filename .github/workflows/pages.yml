name: Deploy console to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'src/livetv/web/static/**'
      - 'src/livetv/**'
      - 'scripts/**'
      - 'config/**'
      - 'pyproject.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# 允许工作流把产物发布到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新推送会取消进行中的旧部署
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      # 在 CI 里用 Python 跑流水线：抓取并解析/合并源，产出 output/report.json
      # --no-test 只做解析合并、不做逐条测速，稳定且快；
      # 想要线上带流畅度评分，可去掉 --no-test（CI 更慢、流量更大）。
      - name: Generate report
        run: python -m livetv check --config config/sources.yaml --no-test

      # 把报告塞进页面，生成只读快照静态站点到 dist/
      - name: Build static snapshot
        run: python scripts/build_static.py --report output/report.json --out dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
